# Server Configuration
server.port=8080
server.port=${PORT:8080}


# # MySQL Database Configuration
# spring.datasource.url=jdbc:mysql://localhost:3306/goimay_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=123456

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration (REQUIRED: set JWT_SECRET env var)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://goimay.vercel.app

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory (lưu trong project để có thể commit vào git)
# Thay đổi từ user home sang thư mục trong project để đồng bộ giữa các máy
app.upload-dir=uploads

# Default Admin (tự tạo khi deploy, không cần đăng ký)
# Khuyến nghị: set trên môi trường deploy (Render/Railway/VM) qua biến ENV:
#   ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_NAME
app.admin.email=${ADMIN_EMAIL:admin@goimay.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.phone=${ADMIN_PHONE:0123456789}

# Cloudinary Configuration (REQUIRED: set these env vars)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Google OAuth Configuration (REQUIRED: set GOOGLE_CLIENT_ID env var)
google.client-id=${GOOGLE_CLIENT_ID}

# Email Configuration (SendGrid Web API)
# Use MAIL_PASSWORD for SendGrid API Key, or SENDGRID_API_KEY directly
# MAIL_FROM should be a verified sender email on SendGrid

# Email sender address (used in emails)
app.mail.from=${MAIL_FROM:noreply@goimay.com}
app.name=Gói Mây
